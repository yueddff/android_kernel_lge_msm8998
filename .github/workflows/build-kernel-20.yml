# LineageOS 20 (Android 13) 内核构建 + 4K 补丁 + 重打包 boot.img
# 用法（和 22 版完全一样）：
#   1. 把 20 的 boot.img 命名为 boot20.img 上传到 12yuedf/android_kernel_lge_msm8998 根目录
#      （4K 补丁 0001-sde-hdmi-edid-drop-DCI-4K-force-UHD-3840x2160.patch 仓库里已有，不用重传）
#   2. 本文件上传到 .github/workflows/build-kernel-20.yml
#   3. Actions → Build Kernel 20 + Repack Boot → Run workflow → 下载 boot20-4k 产物
name: Build Kernel 20 + Repack Boot

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel (lineage-20)
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_lge_msm8998
          ref: lineage-20
          path: kernel

      - name: Download 4K EDID patch from repo and apply
        run: |
          cd kernel
          curl -fL -o 0001-sde-hdmi-edid-drop-DCI-4K-force-UHD-3840x2160.patch \
            "https://raw.githubusercontent.com/yueddff/android_kernel_lge_msm8998/lineage-22.2/0001-sde-hdmi-edid-drop-DCI-4K-force-UHD-3840x2160.patch" \
            || { echo "patch not found in repo - upload it first"; exit 1; }
          git apply --verbose 0001-sde-hdmi-edid-drop-DCI-4K-force-UHD-3840x2160.patch
          echo "4K patch applied OK"

      - name: Setup Clang toolchain
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton_clang.git clang

      - name: Configure kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- REAL_CC=clang \
            lineageos_joan_defconfig

      - name: Build kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- REAL_CC=clang \
            -j$(nproc) Image.gz-dtb KCFLAGS="-Wno-error" CONFIG_WERROR=n

      - name: Download boot20.img (LineageOS 20 boot image from your repo)
        run: |
          curl -fL -o boot.img \
            "https://raw.githubusercontent.com/yueddff/android_kernel_lge_msm8998/lineage-22.2/boot20.img" \
            || { echo "boot20.img not found - upload LineageOS 20 boot.img as boot20.img to your repo"; exit 1; }

      - name: Repack boot image (replace kernel, keep ramdisk)
        run: |
          cd "$GITHUB_WORKSPACE"
          python3 <<'PY'
          import struct

          def align(x, n):
              return (x + n - 1) // n * n

          boot = open('boot.img', 'rb').read()
          kernel = open('kernel/out/arch/arm64/boot/Image.gz-dtb', 'rb').read()

          assert boot[:8] == b'ANDROID!', 'not a boot image'

          ks, ka, rs, ra, ss, sa, ta, ps = struct.unpack_from('<8I', boot, 8)

          kernel_off = ps
          ramdisk_off = kernel_off + align(ks, ps)
          second_off = ramdisk_off + align(rs, ps)

          new_ks = len(kernel)
          new_ramdisk_off = kernel_off + align(new_ks, ps)
          new_second_off = new_ramdisk_off + align(rs, ps)

          out = boot[:kernel_off] + kernel
          out += b'\x00' * (new_ramdisk_off - len(out))
          out += boot[ramdisk_off:second_off]
          out += b'\x00' * (new_second_off - len(out))
          if ss:
              out += boot[second_off:second_off + ss]

          # patch kernel_size in header
          h = bytearray(out[:ps])
          struct.pack_into('<I', h, 8, new_ks)

          with open('new-boot.img', 'wb') as f:
              f.write(bytes(h) + out[ps:])

          print('kernel bytes:', new_ks)
          print('ramdisk bytes:', rs)
          print('page size:', ps)
          print('new-boot.img written')
          PY

      - name: Verify output
        run: |
          ls -l "$GITHUB_WORKSPACE/new-boot.img"
          python3 -c "import struct; d=open('$GITHUB_WORKSPACE/new-boot.img','rb').read(); print('magic:', d[:8]); print('kernel size:', struct.unpack_from('<I', d, 8)[0])"

      - name: Upload boot
        uses: actions/upload-artifact@v4
        with:
          name: boot20-4k
          path: new-boot.img
