name: Build LG V30 (joan) kernel - 4K fix

# ============================================================
# v3：Clang 构建 + 正确的 4K 修复（fbdev MDSS 路径）
# 说明：
#   - 构建方式沿用已验证可用的方案（Clang + lineageos_joan_defconfig + O=out），
#     不再需要任何 GCC 兼容性修复
#   - 4K 修复打在真实生效的路径上：drivers/video/fbdev/msm/mdss_hdmi_edid.c
#     （joan 的 HDMI/DP 输出走 fbdev MDSS 栈，lineageos_joan_defconfig 无 DRM_MSM）
#   - 内核源码 + 编译产物会缓存，第二次起跳过 clone/patch/defconfig，
#     只增量编译改动过的文件（约 5~10 分钟）
# 使用前提：
#   - 补丁文件已上传到本仓库 lineage-22.2 分支根目录：
#     0001-sde-hdmi-edid-drop-DCI-4K-force-UHD-3840x2160.patch
#   - 仓库页 Actions -> 本工作流 -> Run workflow（无需填参数）
# ============================================================

on:
  workflow_dispatch:
    inputs:
      boot_img_url:
        description: '（可选）你当前 LineageOS boot.img 的直链 URL。留空则只输出内核（Image.gz-dtb）。'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout this repo (workflow + patch)
        uses: actions/checkout@v4

      - name: Restore kernel source + build cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/kernel
          key: joan4k-kernel-${{ hashFiles('0001-sde-hdmi-edid-drop-DCI-4K-force-UHD-3840x2160.patch') }}

      - name: Clone LineageOS kernel source (only when no cache)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # 自我保护：若 kernel 目录已存在（例如缓存恢复）则跳过 clone
          if [ -f kernel/Makefile ] && [ -d kernel/.git ]; then
            echo "==> kernel source already present, skipping clone"
          else
            rm -rf kernel
            git clone --depth=1 -b lineage-22.2 https://github.com/LineageOS/android_kernel_lge_msm8998.git kernel
          fi

      - name: Download and apply 4K patch (idempotent, safe with cache)
        run: |
          set -e
          cd kernel
          # 优先用 yueddff，失败则回退 12yuedf（两个用户名都试，总有一个能下到）
          curl -fsSL -o /tmp/fix.patch \
            "https://raw.githubusercontent.com/yueddff/android_kernel_lge_msm8998/lineage-22.2/0001-sde-hdmi-edid-drop-DCI-4K-force-UHD-3840x2160.patch" \
            || curl -fsSL -o /tmp/fix.patch \
            "https://raw.githubusercontent.com/12yuedf/android_kernel_lge_msm8998/lineage-22.2/0001-sde-hdmi-edid-drop-DCI-4K-force-UHD-3840x2160.patch"
          if git apply --check /tmp/fix.patch 2>/dev/null; then
            git apply /tmp/fix.patch
            echo "==> 4K patch applied"
          elif git apply -R --check /tmp/fix.patch 2>/dev/null; then
            echo "==> 4K patch already applied (from cache)"
          else
            echo "!! patch state unknown, forcing apply"
            git apply /tmp/fix.patch
          fi
          git diff --stat

      - name: Install dependencies (incl. clang toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu
          sudo apt-get install -y gcc-arm-linux-gnueabi g++-arm-linux-gnueabi
          sudo apt-get install -y clang
          clang --version | head -1

      - name: Build kernel (Clang, incremental when cache hit)
        id: build
        run: |
          set -e
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CC=clang
          export REAL_CC=clang

          # 有缓存（out/.config 已存在）则跳过 defconfig，直接增量编译
          if [ ! -f out/.config ]; then
            echo "==> Using defconfig: lineageos_joan_defconfig"
            make O=out lineageos_joan_defconfig
          else
            echo "==> Cache hit: using existing .config, incremental build"
          fi

          make O=out -j"$(nproc)" Image.gz-dtb KCFLAGS="-Wno-error" CONFIG_WERROR=n

          echo "==> Build artifacts:"
          ls -lh out/arch/arm64/boot/Image.gz-dtb
          mkdir -p out/final
          cp out/arch/arm64/boot/Image.gz-dtb out/final/Image.gz-dtb
          echo "built=yes" >> "$GITHUB_OUTPUT"

      - name: (Optional) Repack boot.img with your current ramdisk
        if: steps.build.outputs.built == 'yes' && github.event.inputs.boot_img_url != ''
        run: |
          set -e
          cd kernel
          git clone --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg /tmp/mkbootimg

          echo "==> Downloading current boot.img: ${{ github.event.inputs.boot_img_url }}"
          curl -L -o /tmp/stock-boot.img "${{ github.event.inputs.boot_img_url }}"
          ls -lh /tmp/stock-boot.img

          echo "==> Unpacking stock boot.img"
          python3 /tmp/mkbootimg/unpack_bootimg.py \
            --boot_img /tmp/stock-boot.img \
            --out /tmp/boot-unpacked
          cat /tmp/boot-unpacked/boot_info.json

          echo "==> Repacking with new kernel"
          python3 /tmp/mkbootimg/mkbootimg.py \
            --kernel out/final/Image.gz-dtb \
            --ramdisk /tmp/boot-unpacked/ramdisk \
            --base "$(python3 -c "import json;print(json.load(open('/tmp/boot-unpacked/boot_info.json'))['base'])")" \
            --pagesize "$(python3 -c "import json;print(json.load(open('/tmp/boot-unpacked/boot_info.json'))['pagesize'])")" \
            --kernel_offset "$(python3 -c "import json;print(json.load(open('/tmp/boot-unpacked/boot_info.json'))['kernel_offset'])")" \
            --ramdisk_offset "$(python3 -c "import json;print(json.load(open('/tmp/boot-unpacked/boot_info.json'))['ramdisk_offset'])")" \
            --second_offset "$(python3 -c "import json;print(json.load(open('/tmp/boot-unpacked/boot_info.json'))['second_offset'])")" \
            --tags_offset "$(python3 -c "import json;print(json.load(open('/tmp/boot-unpacked/boot_info.json'))['tags_offset'])")" \
            --header_version "$(python3 -c "import json;print(json.load(open('/tmp/boot-unpacked/boot_info.json'))['header_version'])")" \
            --os_version "$(python3 -c "import json;print(json.load(open('/tmp/boot-unpacked/boot_info.json'))['os_version'])")" \
            --os_patch_level "$(python3 -c "import json;print(json.load(open('/tmp/boot-unpacked/boot_info.json'))['os_patch_level'])")" \
            --cmdline "$(python3 -c "import json;print(json.load(open('/tmp/boot-unpacked/boot_info.json'))['cmdline'])")" \
            -o out/final/boot.img
          ls -lh out/final/boot.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: joan-4k-kernel
          path: |
            ${{ github.workspace }}/kernel/out/final/Image.gz-dtb
            ${{ github.workspace }}/kernel/out/final/boot.img
          if-no-files-found: warn

      - name: Save kernel cache (for next run)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/kernel
          key: joan4k-kernel-${{ hashFiles('0001-sde-hdmi-edid-drop-DCI-4K-force-UHD-3840x2160.patch') }}

      - name: Build summary
        run: |
          echo "## 构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- 内核(含DTB): \`Image.gz-dtb\`" >> "$GITHUB_STEP_SUMMARY"
          if ls ${{ github.workspace }}/kernel/out/final/boot.img 2>/dev/null; then
            echo "- 可刷写镜像: \`boot.img\`" >> "$GITHUB_STEP_SUMMARY"
            echo "  刷入: \`fastboot flash boot boot.img\`" >> "$GITHUB_STEP_SUMMARY"
          fi
