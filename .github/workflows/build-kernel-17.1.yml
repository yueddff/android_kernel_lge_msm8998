# LineageOS 17.1 (Android 10) 内核构建 + 4K 补丁 + GCC9 编译 + 重打包 boot.img
# 源: SGCMarkus/android_kernel_lge_msm8998 @ lineage-17.1 (LG V30 joan, 内核 4.4.153)
#
# 为什么 GCC9 + 本地验证过的关键修复（2026-09-29 已在本地 sgcmarkus_17.1 源码验证）：
# 1. ROM 自带内核为 GCC 编译，插坞+WiFi 正常；clang 编译同源码后插坞+WiFi 崩溃。
#    对齐 ROM 的编译方式（GCC），保留 4K 补丁(3840x2160 UHD)。
# 2. runner 用 ubuntu-22.04（20.04 镜像已被 GitHub 移除，等不到 runner）。
#    22.04 没有 python2，但本地验证发现：python2 唯一调用者是 LG 的 gcc-wrapper.py，
#    绕过它之后编译直接用 gcc，完全不需要 python2（见步骤 3）。
# 3. 必须绕过 LG gcc-wrapper.py！Makefile 把 CC 包成 scripts/gcc-wrapper.py $(REAL_CC)，
#    它用 python2 运行且白名单只有 4 条警告，GCC9 编译产生的新警告会全部被它拦截报错。
#    本地实测 sed: CC = $(srctree)/scripts/gcc-wrapper.py $(REAL_CC) -> CC = $(REAL_CC)
# 4. VIDC 真实符号是 CONFIG_MSM_VIDC_V4L2/_VMEM/_GOVERNORS（已查 17.1 源码 Kconfig），
#    不是 CONFIG_MSM_VIDC/_VENC/_VDEC。
# 5. KCFLAGS 只保留 GCC9 支持的 -Wno-error 项；-Wno-error=self-assign/fortify-source/
#    enum-conversion 是 clang 专属选项，GCC9 不认识会直接 cc1 error。
#
# 用法：
#   1. 本文件上传到 .github/workflows/build-kernel-17.1.yml（覆盖）
#   2. 仓库 lineage-22.2 分支里已有 0001-sde-hdmi-edid-4k-fix-lineage-17.1.patch 和 boot17.img
#   3. Actions → Build Kernel 17.1 GCC9 → Run workflow → 下载 boot17-4k-gcc9 产物
name: Build Kernel 17.1 GCC9 + 4K Patch + Repack

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel (SGCMarkus lineage-17.1)
        uses: actions/checkout@v4
        with:
          repository: SGCMarkus/android_kernel_lge_msm8998
          ref: lineage-17.1
          path: kernel

      - name: Download 4K EDID patch and apply
        run: |
          cd kernel
          curl -fL -o 0001-sde-hdmi-edid-4k-fix-lineage-17.1.patch \
            "https://raw.githubusercontent.com/yueddff/android_kernel_lge_msm8998/lineage-22.2/0001-sde-hdmi-edid-4k-fix-lineage-17.1.patch" \
            || { echo "patch not found in repo - upload it first"; exit 1; }
          git apply --verbose 0001-sde-hdmi-edid-4k-fix-lineage-17.1.patch
          echo "4K patch applied OK"

      - name: Bypass LG gcc-wrapper.py (python2-only + 4-line warning whitelist would kill GCC9 build)
        run: |
          cd kernel
          # 本地已验证：把 CC 从 gcc-wrapper.py 包壳改回真实 gcc
          sed -i 's|\$(srctree)/scripts/gcc-wrapper.py \$(REAL_CC)|\$(REAL_CC)|' Makefile
          grep -n "^CC[[:space:]]*=" Makefile
          echo "gcc-wrapper bypassed (CC now points to REAL_CC)"

      - name: Defensive tspdrv fix (only if file exists)
        run: |
          cd kernel
          python3 <<'PY'
          import os
          p = 'include/uapi/linux/tspdrv.h'
          if os.path.exists(p):
              s = open(p).read()
              if '#include <sys/ioctl.h>' in s:
                  s = s.replace('#include <sys/ioctl.h>',
                      '#ifdef __KERNEL__\n#include "ioctl.h"\n#else\n#include <sys/ioctl.h>\n#endif', 1)
                  open(p, 'w').write(s)
                  print('tspdrv.h fixed')
              else:
                  print('tspdrv.h present, no bug')
          else:
              print('tspdrv.h not in 17.1, skip')
          PY

      - name: Install GCC-9 toolchain (aarch64 + arm32)
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential libssl-dev libncurses5-dev zip \
            gcc-9-aarch64-linux-gnu g++-9-aarch64-linux-gnu \
            gcc-9-arm-linux-gnueabi g++-9-arm-linux-gnueabi
          sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-9 /usr/bin/aarch64-linux-gnu-gcc
          sudo ln -sf /usr/bin/aarch64-linux-gnu-g++-9 /usr/bin/aarch64-linux-gnu-g++
          sudo ln -sf /usr/bin/arm-linux-gnueabi-gcc-9 /usr/bin/arm-linux-gnueabi-gcc
          sudo ln -sf /usr/bin/arm-linux-gnueabi-g++-9 /usr/bin/arm-linux-gnueabi-g++
          aarch64-linux-gnu-gcc --version | head -1

      - name: Configure kernel (disable broken VIDC driver, correct symbols for 17.1)
        run: |
          cd kernel
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- lineageos_h930_defconfig
          # 17.1 源码真实符号（本地已查 Kconfig）：
          ./scripts/config --file out/.config -d CONFIG_MSM_VIDC_V4L2 -d CONFIG_MSM_VIDC_GOVERNORS -d CONFIG_MSM_VIDC_VMEM
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig
          grep -E "CONFIG_MSM_VIDC" out/.config || echo "VIDC fully disabled"

      - name: Build kernel (GCC-9)
        run: |
          cd kernel
          make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- -j$(nproc) Image.gz-dtb \
            KCFLAGS="-Wno-error -fcommon -Wno-error=unused-but-set-variable -Wno-error=misleading-indentation" \
            HOSTCFLAGS="-fcommon" > build.log 2>&1 || true
          echo "=== build finished, checking for errors ==="
          grep -nE "error:|Error [0-9]|undefined reference|No such file" build.log | grep -v objdump | head -30
          echo "=== last 20 lines ==="
          tail -20 build.log
          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "=== KERNEL NOT BUILT ==="
            exit 1
          fi
          echo "=== KERNEL BUILT OK ==="

      - name: Download boot17.img (LineageOS 17.1 boot image from repo)
        run: |
          curl -fL -o boot.img \
            "https://raw.githubusercontent.com/yueddff/android_kernel_lge_msm8998/lineage-22.2/boot17.img" \
            || { echo "boot17.img not found - upload LineageOS 17.1 boot.img as boot17.img to your repo"; exit 1; }

      - name: Patch boot with Magisk 30.7 (official boot_patch.sh flow, verified locally)
        run: |
          cd "$GITHUB_WORKSPACE"
          # 下载 Magisk 30.7 官方 APK
          curl -fL -o magisk.apk "https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk"
          unzip -o -q magisk.apk \
            "lib/x86_64/libmagiskboot.so" \
            "lib/arm64-v8a/libmagiskinit.so" \
            "lib/arm64-v8a/libmagisk.so" \
            "lib/arm64-v8a/libinit-ld.so" \
            "assets/stub.apk"
          cp lib/x86_64/libmagiskboot.so magiskboot
          cp lib/arm64-v8a/libmagiskinit.so magiskinit
          cp lib/arm64-v8a/libmagisk.so magisk
          cp lib/arm64-v8a/libinit-ld.so init-ld
          cp assets/stub.apk stub.apk
          chmod +x magiskboot magiskinit magisk init-ld
          ./magiskboot unpack boot.img >/dev/null 2>&1 || exit 1
          echo "unpack OK"
          # 备份原始 ramdisk（boot_patch.sh line 140）
          cp -af ramdisk.cpio ramdisk.cpio.orig
          # 替换内核（自编译 Image.gz-dtb），删除重复拆出的 kernel_dtb
          cp kernel/out/arch/arm64/boot/Image.gz-dtb kernel
          rm -f kernel_dtb
          # 压缩注入文件（magiskboot 自带 xz）
          ./magiskboot compress=xz magisk magisk.xz
          ./magiskboot compress=xz stub.apk stub.xz
          ./magiskboot compress=xz init-ld init-ld.xz
          # 写 config（boot_patch.sh line 182-190）
          SHA1=$(./magiskboot sha1 boot.img)
          printf "KEEPVERITY=false\nKEEPFORCEENCRYPT=false\nRECOVERYMODE=false\nVENDORBOOT=false\nSHA1=%s\n" "$SHA1" > config
          # ramdisk 注入（boot_patch.sh line 192-203）
          ./magiskboot cpio ramdisk.cpio \
            "add 0750 init magiskinit" \
            "mkdir 0750 overlay.d" \
            "mkdir 0750 overlay.d/sbin" \
            "add 0644 overlay.d/sbin/magisk.xz magisk.xz" \
            "add 0644 overlay.d/sbin/stub.xz stub.xz" \
            "add 0644 overlay.d/sbin/init-ld.xz init-ld.xz" \
            "patch" \
            "backup ramdisk.cpio.orig" \
            "mkdir 000 .backup" \
            "add 000 .backup/.magisk config"
          # repack：换内核 + Magisk root
          ./magiskboot repack boot.img new-boot.img
          ls -l new-boot.img

      - name: Verify output (Magisk patched check)
        run: |
          cd "$GITHUB_WORKSPACE"
          ls -l new-boot.img
          mkdir -p vrf && cd vrf
          ../magiskboot unpack ../new-boot.img >/dev/null 2>&1
          ../magiskboot cpio ramdisk.cpio test
          echo "cpio status=$? (1=Magisk patched, 0=stock)"
          ../magiskboot cpio ramdisk.cpio "ls" | grep -E "init|overlay.d/sbin|\.backup/.magisk" | head -8

      - name: Upload boot (Magisk 30.7 patched)
        uses: actions/upload-artifact@v4
        with:
          name: boot17-4k-gcc9-magisk30.7
          path: new-boot.img
