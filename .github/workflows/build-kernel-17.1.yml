# Probe: LineageOS 官方内核 lineage-17.1（joan）
# 目的：编译前确认三件事，避免编译一小时才发现问题
#   1. 官方仓库是否有 lineage-17.1 分支（checkout 失败即无）
#   2. 正确的 defconfig 名称（joan/h930/msm8998 候选）
#   3. 4K 补丁能否直接 git apply 到官方源码
# 用法：上传到仓库 .github/workflows/，Actions → Probe Official Kernel 17.1 → Run workflow
# 结果：下载 probe-report artifact，把 probe.txt 内容发给助手
name: Probe Official Kernel 17.1

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone official kernel (lineage-17.1)
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_lge_msm8998
          ref: lineage-17.1
          path: kernel

      - name: Probe defconfig / patch anchors / apply test
        run: |
          cd kernel
          {
            echo "=== git head ==="
            git log -1 --oneline
            echo
            echo "=== defconfig candidates (joan/h93/msm8998) ==="
            ls arch/arm64/configs/ 2>/dev/null | grep -iE 'joan|h93|h99|msm8998' || echo "(none matched)"
            echo
            echo "=== all defconfigs (head 40) ==="
            ls arch/arm64/configs/ 2>/dev/null | head -40
            echo
            echo "=== mdss_hdmi_edid.c ==="
            ls -l drivers/video/fbdev/msm/mdss_hdmi_edid.c 2>&1
            echo
            echo "=== anchors (patch context lines) ==="
            grep -nE "hdmi_edid_find_hfvsdb|hdmi_edid_set_y420_support|hdmi_edid_add_sink_y420_format|hdmi_edid_add_sink_video_format|hdmi_edid_get_display_mode|preferred_video_format" \
              drivers/video/fbdev/msm/mdss_hdmi_edid.c 2>/dev/null | head -50
            echo
            echo "=== patch apply test ==="
            curl -fsSL -o /tmp/p.patch \
              "https://raw.githubusercontent.com/yueddff/android_kernel_lge_msm8998/lineage-22.2/0001-sde-hdmi-edid-4k-fix-lineage-17.1.patch" \
              && echo "patch downloaded OK" || echo "patch download FAILED"
            if [ -s /tmp/p.patch ]; then
              if git apply --check /tmp/p.patch; then
                echo "PATCH_APPLY=OK"
              else
                echo "PATCH_APPLY=FAILED"
                git apply --verbose /tmp/p.patch 2>&1 | head -30
              fi
            fi
          } > /tmp/probe.txt 2>&1
          cp /tmp/probe.txt "$GITHUB_WORKSPACE/probe.txt"
          cat "$GITHUB_WORKSPACE/probe.txt"

      - name: Upload probe report
        uses: actions/upload-artifact@v4
        with:
          name: probe-report
          path: probe.txt
